project:
  type: website

website:
  title: "regurgitate"
  reader-mode: true
  repo-url: https://github.com/coatless-quarto/regurgitate/
  repo-actions: [edit, issue]
  sidebar:
    logo: "regurgitate-animated-logo.svg"
    logo-alt: "A hexagon logo for the regurgitate extension."
    style: "floating"
    search: true
    tools:
      - icon: github
        href: https://github.com/coatless-quarto/regurgitate/
    contents: 
      - text: "Home"
        file: index.qmd
      - section: "Examples"
        contents:
        - section: "Getting Started"
          contents:
            - qregurgitate-basic.qmd
        - section: "Display"
          contents:
            - qregurgitate-group-by-language.qmd
            - qregurgitate-hide-inline.qmd
            - qregurgitate-code-only.qmd
        - section: "Appendix"
          contents:
            - qregurgitate-custom-title.qmd
            - qregurgitate-header-level.qmd
            - qregurgitate-no-separator.qmd
        - section: "Blocks"
          contents:
            - qregurgitate-numbered.qmd
            - qregurgitate-filename.qmd
            - qregurgitate-collapsible.qmd
            - qregurgitate-exclude.qmd
      - section: "Support"
        contents:
        - text: "FAQ"
          href: qregurgitate-faq.qmd
        - text: "Submit an issue"
          href: https://github.com/coatless-quarto/regurgitate/issues/new/choose
      - section: "Extra"
        contents:
        - qregurgitate-release-notes.qmd
        - href: https://blog.thecoatlessprofessor.com/projects/regurgitate/
          text: "Blog posts"

format: 
  html:
    toc: true